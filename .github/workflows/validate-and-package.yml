name: Validate and Package Detections

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate rules
        run: python3 scripts/validate_rules.py

      - name: Package rules
        run: python3 scripts/package_rules.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rules-bundle
          path: dist/rules_bundle.json
